{% load humanize %}
<!-- Partial Repayment Bottom Sheet Modal -->
<div class="sheet-overlay" id="debt-pay-overlay"></div>
<div class="sheet debt-pay-sheet" id="debt-pay-sheet" role="dialog" aria-modal="true" aria-label="Record repayment">
  <div class="sheet-head" style="display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;">
    <div style="font-weight:800;font-size:16px;color:var(--ink)">Record Repayment</div>
    <button type="button" class="sheet-head-btn" id="debt-pay-close" aria-label="Close modal"><svg class="icon"><use href="#icon-close"></use></svg></button>
  </div>

  <form method="post" id="debt-pay-form" action="" style="padding:4px 0 10px">
    {% csrf_token %}
    <div style="margin-bottom:14px;background:var(--surface-chip);padding:10px 12px;border-radius:12px">
      <div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px" id="debt-pay-person-title">Repayment for Person</div>
      <small class="muted" id="debt-pay-rem-info">Remaining: Rp0</small>
    </div>

    <div class="form-field">
      <label for="debt-pay-amount">Repaid Amount (Rp)</label>
      <input type="number" name="amount" id="debt-pay-amount" class="input" placeholder="0" required step="any" min="1" inputmode="numeric">
    </div>

    <div class="form-field" style="margin-top:12px">
      <label id="debt-pay-wallet-label">Funded Account (Optional)</label>
      <input type="hidden" name="wallet" id="debt-pay-wallet" value="">
      <button type="button" class="wallet-select-card" id="debt-pay-wallet-trigger" aria-label="Select Account">
        <div class="w-card-left">
          <span class="w-card-icon" id="debt-pay-wallet-icon" style="background:var(--surface-muted);color:var(--muted)">
            <svg class="icon"><use href="#icon-payments"></use></svg>
          </span>
          <div class="w-card-meta">
            <span class="w-card-name" id="debt-pay-wallet-name">None (pure ledger)</span>
            <span class="w-card-bal muted" id="debt-pay-wallet-bal">No account balance sync</span>
          </div>
        </div>
        <div class="w-card-right">
          <span class="w-card-action-hint">Change</span>
          <svg class="icon w-card-chevron"><use href="#icon-chevron_right"></use></svg>
        </div>
      </button>
      <small class="muted" id="debt-pay-wallet-hint" style="display:block;margin-top:4px;font-size:11px">
        Selecting an account automatically updates its balance with an Income / Expense transaction.
      </small>
    </div>

    <div class="form-field" style="margin-top:12px">
      <label for="debt-pay-note">Note / Reference (Optional)</label>
      <input type="text" name="note" id="debt-pay-note" class="input" placeholder="e.g. Bank transfer, Cash, Lunch offset..." maxlength="200">
    </div>

    <div class="sheet-actions" style="margin-top:18px">
      <button type="submit" class="btn btn-primary" id="debt-pay-submit" style="flex:1">Save Repayment</button>
      <button type="button" class="btn btn-ghost" id="debt-pay-cancel" style="flex:1">Cancel</button>
    </div>
  </form>
</div>

<script>
document.getElementById('debt-pay-cancel')?.addEventListener('click', function() {
  if (window.closeDebtPaySheet) window.closeDebtPaySheet();
});
document.getElementById('debt-pay-close')?.addEventListener('click', function() {
  if (window.closeDebtPaySheet) window.closeDebtPaySheet();
});
document.getElementById('debt-pay-form')?.addEventListener('submit', function() {
  if (window.closeDebtPaySheet) window.closeDebtPaySheet();
});
</script>
