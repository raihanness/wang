{% extends "base.html" %}
{% load static %}
{% block page_name %}login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-ambient-glow"></div>
  <div class="card auth-card">
    <div class="center" style="margin-bottom:20px">
      <div class="auth-badge-wrap">
        <img src="{% static 'img/logo-fix.png' %}" alt="Wang" class="brand-badge brand-logo-img">
      </div>
      <h2>Welcome back</h2>
      <p class="muted" style="margin:4px 0 0;font-size:13.5px">Sign in to your Wang dashboard</p>
    </div>

    <!-- {% if form.errors %}
      <div class="auth-error-box" style="margin-bottom:16px">
        <svg class="icon"><use href="#icon-error"></use></svg>
        <span>
          {% if form.non_field_errors %}
            {% if "Please enter a correct username and password" in form.non_field_errors.0 %}
              Invalid username or password. Please try again.
            {% else %}
              {{ form.non_field_errors.0 }}
            {% endif %}
          {% elif form.username.errors and form.password.errors %}
            Username and password are required.
          {% elif form.username.errors %}
            Please enter your username.
          {% elif form.password.errors %}
            Please enter your password.
          {% else %}
            Invalid username or password. Please try again.
          {% endif %}
        </span>
      </div>
    {% endif %} -->

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-row" style="gap:16px">
        <div>
          <label for="id_username">Username</label>
          <div class="input-icon-wrap">
            <svg class="icon input-icon-left"><use href="#icon-person"></use></svg>
            <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" placeholder="Enter your username" value="{{ form.username.value|default:'' }}">
          </div>
        </div>

        <div>
          <label for="id_password">Password</label>
          <div class="input-icon-wrap">
            <svg class="icon input-icon-left"><use href="#icon-lock"></use></svg>
            <input type="password" name="password" autocomplete="current-password" required id="id_password" placeholder="Enter your password">
            <button type="button" class="input-reveal-btn" id="toggle-password" aria-label="Show password" title="Show password">
              <svg class="icon"><use href="#icon-visibility"></use></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="form-actions" style="margin-top:24px">
        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px">
          <span>Log in</span>
          <svg class="icon" style="font-size:18px"><use href="#icon-arrow_forward"></use></svg>
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
